aid: lula
name: Lula
description: >-
  Lula Technologies, Inc. was a Miami, Florida insurance-infrastructure company founded by twin
  brothers Matthew Vega-Sanz (CEO) and Michael Vega-Sanz (President). It started as the car-sharing
  startup Lula Rides and pivoted during the COVID-19 pandemic into an API-first — widely described
  at the time as "Stripe-like" — insurance platform for small and mid-sized car rental, car-sharing,
  trucking and logistics fleet operators, bundling driver vetting and risk assessment, fraud
  detection, driver-history checks, episodic/on-demand policy issuance and claims handling behind a
  single API underwritten through licensed insurance partners. It raised an $18M Series A in July
  2021 and a $35.5M Series B, and its public developer surface was a Postman documenter collection
  alongside a developer portal at www.lula.is/developers. In 2024 Lula divested its insurance
  division to Nantucket Capital Corp, a San Diego MGA, headcount fell from roughly 150 to about 19,
  and the founders sold the company. The domain lula.is has since left the company's control — it
  now delegates to parkingcrew.net and serves a "This domain may be for sale!" holding page — the
  API host api.lula.is is gone, and the Postman collection returns 404. No public API surface
  remains. NOTE FOR FUTURE PASSES — the same founders later built a SEPARATE company, Gail
  (legal entity Nothing Technologies, Inc., meetgail.com), which does operate a live developer
  surface; Gail is not a rename of Lula and none of its artifacts may be attributed to this
  profile. Two other unrelated companies also trade as "Lula": Lula (lula.life, property
  maintenance) and Lula Commerce (lulacommerce.com, convenience retail). This profile is retained
  as a historical company record.
